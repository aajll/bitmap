name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ---------------------------------------------------------------------------
  # Meson-built tests run under ASan + UBSan. The
  # packaging integration tests also run, but their isolated consumer builds
  # use their own compiler flags and are not sanitizer-instrumented.
  # ---------------------------------------------------------------------------
  test:
    name: "Test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build pkg-config

      - name: Install meson
        run: uv tool install meson

      - name: Configure (debug + sanitizers)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=address,undefined

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # The caller-serialized threaded example must be clean under
  # ThreadSanitizer. Every conflicting bitmap access runs under a caller mutex,
  # so a TSAN report here means the example or the contract is wrong.
  # ---------------------------------------------------------------------------
  tsan:
    name: "ThreadSanitizer"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: uv tool install meson

      - name: Configure (TSAN)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_sanitize=thread

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --verbose

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-tsan
          path: build/meson-logs/testlog.txt

  # ---------------------------------------------------------------------------
  # Verify the library sources compile clean for a bare-metal 32-bit target
  # with no libc startup. Integration tests are native-only and are not run.
  # ---------------------------------------------------------------------------
  cross-compile:
    name: "Cross-compile (arm-none-eabi)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: sudo apt-get update -q && sudo apt-get install -y gcc-arm-none-eabi

      - name: Compile library sources
        run: >
          arm-none-eabi-gcc -std=c11 -Wall -Wextra -Werror
          -mcpu=cortex-m0 -mthumb -ffreestanding -Os
          -Iinclude -c src/bitmap.c -o /tmp/bitmap.o

  # ---------------------------------------------------------------------------
  # Cross-build the library with the TI C2000 code generation tools, a
  # 16-bit-MAU target (CHAR_BIT == 16), under both object formats.
  # ---------------------------------------------------------------------------
  c2000:
    name: "TI C2000 (CGT ${{ matrix.cgt }})"
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - cgt: "22.6.2"
            sha256: "9773f338df7b7314bc459be2cd9d9bf329786da8de6531f8f2d3d38c1e9f5750"
          - cgt: "25.11.1"
            sha256: "2f3a978e24a53279c9796ad374c32b530fc58fd085fd71288597846fe169c821"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install meson and ninja
        run: uv tool install meson && uv tool install ninja

      - name: Cache TI C2000 CGT
        id: cache-cgt
        uses: actions/cache@v4
        with:
          path: ~/ti
          key: ti-cgt-c2000-${{ matrix.cgt }}

      - name: Install TI C2000 CGT
        if: steps.cache-cgt.outputs.cache-hit != 'true'
        run: |
          bin="ti_cgt_c2000_${{ matrix.cgt }}.LTS_linux-x64_installer.bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$bin" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-xqxJ05PLfM/${{ matrix.cgt }}.LTS/$bin"
          echo "${{ matrix.sha256 }}  $RUNNER_TEMP/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/$bin"
          "$RUNNER_TEMP/$bin" --mode unattended --prefix "$HOME/ti"

      - name: Configure and build (COFF and EABI)
        run: |
          CGT="$HOME/ti/ti-cgt-c2000_${{ matrix.cgt }}.LTS"
          for abi in coffabi eabi; do
            cat > "c2000-$abi.ini" <<INI
          [binaries]
          c = '$CGT/bin/cl2000'
          ar = '$CGT/bin/ar2000'
          strip = '$CGT/bin/strip2000'

          [built-in options]
          c_args = ['-v28', '--float_support=fpu32', '--abi=$abi', '-I$CGT/include']

          [host_machine]
          system = 'bare-metal'
          cpu_family = 'c2000'
          cpu = 'c28x'
          endian = 'little'
          INI
            meson setup "build-$abi" --cross-file="c2000-$abi.ini" \
              -Dbuild_tests=false -Dwerror=true
            meson compile -C "build-$abi"
          done

  # ---------------------------------------------------------------------------
  # Enforce clang-format on all hand-written sources. scripts/format.sh pins
  # the clang-format release and runs it through uvx, so CI and local checks
  # use the same formatter whatever the runner's packages provide.
  # ---------------------------------------------------------------------------
  format:
    name: "clang-format"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Check formatting
        run: scripts/format.sh

  # ---------------------------------------------------------------------------
  # Verify the library compiles cleanly in release mode with no tests, the
  # configuration a downstream project would use.
  # ---------------------------------------------------------------------------
  release-build:
    name: "Release build"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson
        run: uv tool install meson

      - name: Configure (release)
        run: meson setup build --buildtype=release -Dbuild_tests=false

      - name: Build
        run: meson compile -C build

      - name: Run measurement tools
        run: bench/measure.sh

  # ---------------------------------------------------------------------------
  # Coverage gate. The suite reaches 100% line and branch coverage of the
  # shipped interface; the gate keeps it there.
  # ---------------------------------------------------------------------------
  coverage:
    name: "Coverage gate"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install ninja
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build

      - name: Install meson and gcovr
        run: uv tool install meson && uv tool install gcovr

      - name: Configure (coverage)
        run: >
          meson setup build
          --buildtype=debug
          -Dbuild_tests=true
          -Db_coverage=true

      - name: Build
        run: meson compile -C build

      - name: Run tests
        run: meson test -C build --verbose

      - name: Generate coverage report
        run: |
          mkdir -p coverage-report
          gcovr \
            --root . \
            --filter 'src/' \
            --filter 'include/' \
            --html-details coverage-report/index.html \
            --txt coverage-report/summary.txt \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-branch 100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

  # ---------------------------------------------------------------------------
  # MISRA C:2023 static analysis via misch (cppcheck + misra addon), driven by
  # misra.toml. Rule texts are never committed; set a MISRA_RULE_TEXTS secret
  # for categorised output. Without it, findings are still detected and still
  # fail the job, only headlines are absent. `misch deviations` enforces that
  # every suppression carries a justification.
  # ---------------------------------------------------------------------------
  misra:
    name: "MISRA (misch)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install ninja and cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y ninja-build cppcheck

      - name: Install meson and misch
        run: uv tool install meson && uv tool install misch

      - name: Provide MISRA rule texts (optional secret)
        env:
          RULE_TEXTS: ${{ secrets.MISRA_RULE_TEXTS }}
        run: |
          if [ -n "$RULE_TEXTS" ]; then
            printf '%s\n' "$RULE_TEXTS" > "$RUNNER_TEMP/misra_rule_texts.txt"
            echo "MISRA_RULE_TEXTS=$RUNNER_TEMP/misra_rule_texts.txt" >> "$GITHUB_ENV"
          else
            echo "No MISRA_RULE_TEXTS secret; findings will be category: unknown."
          fi

      - name: Configure (compile database)
        run: meson setup build --buildtype=debug -Dbuild_tests=true

      - name: Analyse
        run: misch run -v

      - name: Deviation record
        run: misch deviations
